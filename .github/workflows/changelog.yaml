### ### Changelog
###
### Checks that changelog has been updated

name: Changelog

on:
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Git fetch
        run: git fetch

      - name: Check that changelog has been updated.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --exit-code "origin/$BASE_REF" -- CHANGELOG.md && exit 1 || exit 0
